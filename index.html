<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=dashboard/" />
  <title>DPA Orphans Court Migration</title>
  <style>
    :root {
      --bg: #f5f0e8;
      --text: #312d28;
      --muted: #716a60;
      --line: #ddd1c2;
      --navy: #244c73;
      --panel: #fffdfa;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(90deg, rgba(36, 76, 115, 0.035) 1px, transparent 1px),
        linear-gradient(180deg, rgba(60, 111, 88, 0.035) 1px, transparent 1px),
        var(--bg);
      background-size: 44px 44px;
      color: var(--text);
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      line-height: 1.5;
    }
    main {
      width: min(640px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 28px;
      box-shadow: 0 12px 30px rgba(63, 45, 29, 0.08);
    }
    h1 {
      margin: 0 0 10px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      line-height: 1.05;
    }
    p {
      margin: 0 0 18px;
      color: var(--muted);
    }
    a {
      display: inline-flex;
      align-items: center;
      border: 1px solid #c9d8de;
      border-radius: 999px;
      background: #edf4f7;
      color: var(--navy);
      padding: 9px 14px;
      text-decoration: none;
      font-weight: 700;
    }
    a:hover,
    a:focus-visible {
      background: var(--navy);
      color: #fff;
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>DPA Orphans Court Migration</h1>
    <p>The project dashboard has moved to a dedicated dashboard folder.</p>
    <a href="dashboard/">Open dashboard</a>
  </main>
</body>
</html>
